<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FreshSave — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-logo" onclick="goHome()" style="cursor:pointer"><i class="bi bi-leaf-fill"></i> FreshSave</div>
    <h2 style="font-size:20px;font-weight:700;margin-bottom:4px;text-align:center">Create your free account</h2>
    <p style="font-size:13px;color:var(--gray);text-align:center;margin-bottom:22px">Join thousands of users reducing food waste</p>

    <div class="auth-error" id="signup-error"></div>

    <div class="form-group">
      <label><i class="bi bi-person-fill"></i> Full Name</label>
      <input type="text" id="signup-name" placeholder="Your full name"/>
    </div>
    <div class="form-group">
      <label><i class="bi bi-envelope-fill"></i> Email Address</label>
      <input type="email" id="signup-email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label><i class="bi bi-lock-fill"></i> Password</label>
      <input type="password" id="signup-pass" placeholder="At least 6 characters"/>
    </div>
    <div class="form-group">
      <label><i class="bi bi-lock-fill"></i> Confirm Password</label>
      <input type="password" id="signup-pass2" placeholder="Repeat your password"/>
    </div>

    <div class="form-group">
      <label>I am registering as&hellip;</label>
      <div class="role-select-row" id="role-picker">
        <div class="role-card selected" data-role="buyer" onclick="pickRole(this)">
          <div class="rc-icon"><i class="bi bi-bag-heart-fill"></i></div>
          <div class="rc-name">Buyer</div>
          <div class="rc-desc">Browse &amp; reserve deals</div>
        </div>
        <div class="role-card" data-role="seller" onclick="pickRole(this)">
          <div class="rc-icon"><i class="bi bi-shop"></i></div>
          <div class="rc-name">Seller</div>
          <div class="rc-desc">Post surplus food listings</div>
        </div>
      </div>
    </div>

    <button id="signup-btn" class="btn btn-green" style="width:100%" onclick="doSignup()">
      Create Account <i class="bi bi-arrow-right-circle-fill"></i>
    </button>

    <div class="auth-divider" style="margin-top:18px">
      Already have an account?
      <span onclick="goLogin()" style="color:var(--green);font-weight:600;cursor:pointer">Log in</span>
    </div>
    <div style="text-align:center;margin-top:10px">
      <span onclick="goHome()" style="font-size:13px;color:var(--gray);cursor:pointer">
        <i class="bi bi-arrow-left"></i> Back to homepage
      </span>
    </div>
  </div>
</div>

<div id="fs-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/signup.js"></script>
</body>
</html>
